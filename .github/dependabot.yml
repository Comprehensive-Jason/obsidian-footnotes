# Dependabot version updates for every npm package, checked weekly (Jason's
# choice, 2026-11-10). There is no "allow" list on purpose: GitHub applies
# "allow" to security updates too, so naming packages there would stop
# security pull requests for every package it leaves out, including those
# that other packages pull in, such as vite and postcss.
#
# remark-obsidian, the parser, gets a pull request of its own, since a new
# release can change how notes are read. The other packages come grouped, one
# pull request for minor and patch releases; a major release opens its own.
# The groups apply to version updates only, so a security fix still opens its
# own pull request at once. CI runs the suite on each, but it does not check
# LICENSE-THIRD-PARTY.md: a pull request that changes what main.js bundles
# needs the notices table updated by hand.
#
# The grouped pull request merges itself once CI passes; the others wait for
# Jason (workflows/dependabot-auto-merge.yml, 2026-11-26). This repo is a
# GitHub fork, and GitHub runs version updates on a fork only after its owner
# turns them on in Settings, Advanced Security, so none ran from 2026-11-10
# until Jason did, on 2026-11-26.
#
# The obsidian typings and the CodeMirror packages stay at what the oldest
# supported Obsidian (minAppVersion in manifest.json) ships, so the compiler
# rejects an API those users lack; they move by hand when minAppVersion moves
# (Jason, 2026-11-10). The CodeMirror packages are skipped even for patch
# releases, because the obsidian typings require their exact versions and npm
# refuses any other (pull request #70, 2026-11-27). @types/node stays on the
# Node that CI runs (22); the plugin's own code uses no Node API.
#
# TypeScript stays on 6 until typescript-eslint supports 7: it accepts only
# TypeScript below 6.1, so npm refuses to install 7 beside it (pull request
# #71; Jason, 2026-11-27).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # A release has to be 3 days old before Dependabot offers it, so a burst
    # of quick fixes (remark-obsidian 2.2.3 and 2.2.4 came out the same day)
    # arrives as one update. Security fixes skip the wait.
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "obsidian"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@codemirror/*"
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # remark-obsidian is left out of the group, so it gets its own PR
      everything-else:
        patterns:
          - "*"
        exclude-patterns:
          - "@quartz-community/remark-obsidian"
        update-types:
          - "minor"
          - "patch"
